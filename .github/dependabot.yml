version: 2
# Marc's standing rule (CLAUDE.md, "Dependabot / security / code-quality
# mandate"): every update Dependabot can propose is applied and merged
# automatically once CI is green — patch, minor and major alike. So nothing is
# ignored here except one hard blocker, the cadence is daily rather than
# weekly, and lockstep package families are grouped so they move together
# (the class that produced red PRs on 2026-09-09: a Storybook core bump
# without its addons, a plugin-react bump without Vite). The auto-merge itself
# is .github/workflows/dependabot-automerge.yml; anything that needs a real
# migration to go green is picked up by the triage routine described in
# CLAUDE.md.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    cooldown:
      # Nothing is merged the day it is published. `npm audit`/Dependabot
      # alerts only catch advisories that already exist, so a freshly
      # published malicious version has none — this window is what closes
      # that gap without a human in the loop. Everything still merges
      # automatically, just a few days later.
      default-days: 3
      semver-major-days: 7
    groups:
      radix:
        patterns:
          - "@radix-ui/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/*"
    ignore:
      # The ONE deliberate exception — a hard blocker, not a policy choice:
      # typescript-eslint declares peer `typescript >=4.8.4 <6.1.0`, so
      # TypeScript 7 cannot even install next to it (`npm ci` fails with
      # ERESOLVE; that was PR #4 on 2026-09-09). Remove this entry the moment
      # typescript-eslint publishes support for TypeScript 7 — the triage
      # routine re-checks `npm view typescript-eslint peerDependencies` on
      # every pass and is told to drop it then.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The agent's dashboard (private, embedded into the Go binary). A bump here
  # changes forsight/internal/api/webdist/ — `make build-web` must be re-run
  # and the refreshed embed committed on the same PR, or the `web` check
  # fails by design (see forsight-ci.yml).
  - package-ecosystem: "npm"
    directory: "/forsight/web"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      # Nothing is merged the day it is published. `npm audit`/Dependabot
      # alerts only catch advisories that already exist, so a freshly
      # published malicious version has none — this window is what closes
      # that gap without a human in the loop. Everything still merges
      # automatically, just a few days later.
      default-days: 3
      semver-major-days: 7
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: "gomod"
    directory: "/forsight"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      # Nothing is merged the day it is published. `npm audit`/Dependabot
      # alerts only catch advisories that already exist, so a freshly
      # published malicious version has none — this window is what closes
      # that gap without a human in the loop. Everything still merges
      # automatically, just a few days later.
      default-days: 3
      semver-major-days: 7
    groups:
      go-modules:
        patterns:
          - "*"

  # Actions are the highest-consequence ecosystem here: a bump rewrites a
  # `uses:` SHA, and `release.yml` executes those Actions with a token that can
  # publish. They still auto-merge (Marc's rule), but with the longest cooldown
  # in the file, so a compromised upstream release has days to be disclosed and
  # yanked before it can land unattended. To take Actions out of auto-merge
  # entirely, add `github-actions` to the ecosystem check in
  # dependabot-automerge.yml's `arm` job — one condition, nothing else changes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 7
