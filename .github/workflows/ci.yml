name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by dependabot-automerge.yml / release.yml on a head they moved
  # with GITHUB_TOKEN. Such pushes create no workflow runs of their own
  # (workflow_dispatch is the documented exception); a PR opened or updated by
  # GITHUB_TOKEN does produce `pull_request` runs, but parked in an
  # approval-required state, so the dispatched run is what actually reports.
  workflow_dispatch:

# CI never writes to the repo — pin the token to read-only.
permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Runtime floor stays Node >=18.18 (see package.json engines) — the
        # compiled dist runs there. The dev toolchain (test-runner, attw,
        # concurrently) targets active LTS, so CI verifies on 20 and 22.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke
      - run: npx size-limit
      - run: npm run test:package # publint + are-the-types-wrong on the built package

  audit:
    name: audit (npm audit, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # High/critical advisories anywhere in the tree block the merge — fix by
      # upgrading (or an `overrides` entry for a stuck transitive), never by
      # ignoring. Moderate/low ones arrive as Dependabot PRs instead.
      - run: npm audit --audit-level=high

  consumer:
    name: consumer (packed tarball in a Next.js + Tailwind v4 app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:consumer

  storybook:
    name: storybook (build + a11y/render test runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - run: npm run test:storybook:ci
